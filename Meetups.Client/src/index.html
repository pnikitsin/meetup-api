<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Meetups — сообщество встреч</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Meetups — единое пространство для планирования и управления встречами сообщества."
    />
    <meta name="theme-color" content="#5b4bdb" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('meetups.theme');
          const dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0d1119' : '#5b4bdb');
        } catch {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
